name: build-release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p safecode
      - uses: actions/upload-artifact@v6
        with:
          name: safecode-${{ matrix.os }}
          path: |
            target/release/safecode
            target/release/safecode.exe
          if-no-files-found: error
